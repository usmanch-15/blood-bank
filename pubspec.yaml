name: bloodbank
description: "Blood Bank - A Flutter mobile application for managing blood donations and requests"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.3        # confirmDonation / getDonorContact Cloud Functions

  # Networking (maps_service.dart use karta hai — pehle sirf transitive
  # dependency ki wajah se chal raha tha, ab explicitly declare kiya)
  http: ^1.2.2

  # Google Maps & Location
  flutter_map: ^7.0.2       # was google_maps_flutter — OpenStreetMap, no API key/billing needed
  latlong2: ^0.9.1          # LatLng type used by flutter_map
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # State Management
  provider: ^6.1.2

  # Local storage — used by ThemeController to persist the user's
  # Light/Dark/System theme choice across app restarts
  shared_preferences: ^2.3.2

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # Charts
  fl_chart: ^0.69.0

  # PDF & Certificates
  pdf: ^3.11.1

  # Splash (build-time tool — driven by the flutter_native_splash: config
  # block at the bottom of this file, never imported directly in lib/,
  # so don't remove this thinking it's "unused")
  flutter_native_splash: ^2.4.1

  # Exports
  csv: ^6.0.0

  # Sharing
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # ✅ fonts section completely removed - using google_fonts package instead

flutter_native_splash:
  color: "#8B0000"
  background_image: assets/images/splash_logo.png
  android: true
  ios: true
  web: true
  fullscreen: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    background_color: "#8B0000"
    theme_color: "#8B0000"