name: bloodbank
description: "Blood Bank - A Flutter mobile application for managing blood donations and requests"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  responsive_framework: ^1.4.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  skeletonizer: ^1.4.2
  timelines_plus: ^1.0.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4

  # Google Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # State Management
  provider: ^6.1.2

  # Utilities
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  uuid: ^4.4.0
  connectivity_plus: ^6.1.1

  # Charts
  fl_chart: ^0.69.0

  # PDF & Certificates
  pdf: ^3.11.1
  printing: ^5.13.1

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Permissions
  permission_handler: ^11.3.1

  # Phone Formatting
  phone_form_field: ^10.0.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Toast Messages
  fluttertoast: ^8.2.8

  # Splash
  flutter_native_splash: ^2.4.1

  # QR Code
  qr_flutter: ^4.1.0

  # File Handling
  file_picker: ^8.0.0+1

  # Exports
  excel: ^4.0.3
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # ✅ fonts section completely removed - using google_fonts package instead

flutter_native_splash:
  color: "#8B0000"
  background_image: assets/images/splash_logo.png
  android: true
  ios: true
  web: true
  fullscreen: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    background_color: "#8B0000"
    theme_color: "#8B0000"