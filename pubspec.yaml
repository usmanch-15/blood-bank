name: bloodbank
description: "Blood Bank - A Flutter mobile application for managing blood donations and requests"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4

  # Google Maps
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # State Management
  provider: ^6.1.2

  # Utilities
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UI Enhancements
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0

  # PDF & Certificates
  pdf: ^3.11.1
  printing: ^5.13.1

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Connectivity
  connectivity_plus: ^6.1.1

  # Charts
  fl_chart: ^0.69.0

  # Animations
  flutter_animate: ^4.5.0

  # Permission Handler
  permission_handler: ^11.3.1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Toast Messages
  fluttertoast: ^8.2.8

  # Skeleton Loading
  skeletonizer: ^1.4.2

  # Typography & Web
  google_fonts: ^6.2.1
  responsive_framework: ^1.4.0

  # File / data utilities
  file_picker: ^8.0.0+1
  uuid: ^4.4.0
  qr_flutter: ^4.1.0
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
